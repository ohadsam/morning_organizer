name: CI & Release

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web checks (static, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Static + security checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Layout sweep (sizes x languages x big text)
        run: QUICK=1 node tests/e2e/layout.mjs
      - name: Dependency audit (dev tooling only - the shipped app has no dependencies)
        run: npm audit --audit-level=high

  android:
    name: Android (unit tests, lint, APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      # Default signing = the committed shared key (stable in-place updates). Optional override with the four KEYSTORE_*
      # secrets (a private key you control). See docs/RELEASING.md.
      - name: Use private signing key (only if secrets exist)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Using the committed shared signing key." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unit tests
        run: gradle -p android testDebugUnitTest --stacktrace --no-daemon
      - name: Lint
        run: gradle -p android lintDebug --stacktrace --no-daemon
      - name: Show lint report on failure
        if: failure()
        run: cat android/app/build/reports/lint-results-debug.txt || true
      - name: Build release APK
        run: gradle -p android assembleRelease --stacktrace --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/morning-organizer.apk
          sha256sum dist/morning-organizer.apk | tee dist/morning-organizer.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: morning-organizer-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish latest APK
    needs: [web, android]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: morning-organizer-apk, path: dist }
      - name: Create GitHub release (becomes "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./web/version.json').version")
          TAG="build-${GITHUB_RUN_NUMBER}"
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' docs/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SonRise $VERSION" > notes.md
          gh release create "$TAG" dist/morning-organizer.apk dist/morning-organizer.apk.sha256 \
            --title "v$VERSION (build ${GITHUB_RUN_NUMBER})" --notes-file notes.md --target "$GITHUB_SHA" --latest
          # keep the release list tidy: newest 10 stay
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r old; do
            gh release delete "$old" --cleanup-tag --yes || true
          done
